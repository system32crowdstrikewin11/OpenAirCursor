name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (e.g. v1.0.1)"
        required: true
        type: string
      prerelease:
        description: "Mark this release as a pre-release"
        required: false
        default: false
        type: boolean

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install SDK packages
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -name sdkmanager -type f | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Fetch and verify model asset
        run: ./scripts/fetch-model.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify tag matches app/build.gradle.kts versionName
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${INPUT_TAG:-${GITHUB_REF_NAME}}"
          NAME="${TAG#v}"
          GRADLE_VER=$(sed -n 's/^[[:space:]]*versionName = "\(.*\)"/\1/p' app/build.gradle.kts | head -1)
          if [ "$NAME" != "$GRADLE_VER" ]; then
            echo "ERROR: Tag ($TAG) does not match versionName ($GRADLE_VER) in app/build.gradle.kts" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Decode release keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Collect artifacts
        run: |
          NAME="${{ steps.version.outputs.name }}"
          mkdir -p dist
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -1)
          if [ -z "$APK" ]; then
            echo "No release APK found"; ls -la app/build/outputs/apk/release || true; exit 1
          fi
          cp "$APK" "dist/OpenAirCursor-${NAME}-arm64-v8a.apk"
          if [ -f app/build/outputs/mapping/release/mapping.txt ]; then
            cp app/build/outputs/mapping/release/mapping.txt "dist/OpenAirCursor-${NAME}-mapping.txt"
          fi
          (cd dist && sha256sum ./* > SHA256SUMS.txt)
          ls -la dist

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenAirCursor-${{ steps.version.outputs.name }}
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: OpenAirCursor ${{ steps.version.outputs.name }}
          generate_release_notes: true
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
          files: dist/*
          fail_on_unmatched_files: true
