name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build debug + release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install SDK packages
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -name sdkmanager -type f | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Fetch and verify model asset
        run: ./scripts/fetch-model.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Verify zero trackers and no INTERNET permission
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -1)
          if "$SDK_ROOT/build-tools/35.0.0/aapt2" dump permissions "$APK" | grep -q "android.permission.INTERNET"; then
            echo "ERROR: INTERNET permission leaked into release APK!" >&2
            exit 1
          fi
          echo "Verified: release APK has no INTERNET permission."

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenAirCursor-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
